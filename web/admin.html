<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serenity Space · Patrol Admin</title>
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
  :root { --bg:#f8fafc; --card:#fff; --line:#e2e8f0; --text:#0f172a; --muted:#64748b; --brand:#0369a1;
          --green:#15803d; --gbg:#dcfce7; --amber:#b45309; --abg:#fef3c7; --red:#b91c1c; --rbg:#fee2e2; --sbg:#f1f5f9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Gujarati",sans-serif; }
  header { background:#0f172a; color:#fff; padding:12px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header b { font-size:16px; } header .sp { flex:1; } header .clk { font-variant-numeric:tabular-nums; color:#bae6fd; }
  header button { background:none; border:1px solid #475569; color:#cbd5e1; border-radius:8px; padding:5px 10px; cursor:pointer; }
  nav { display:flex; gap:4px; padding:8px 20px 0; background:#fff; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav button { border:0; background:none; padding:10px 14px; font-size:14px; color:var(--muted); border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap; }
  nav button.on { color:var(--brand); border-color:var(--brand); font-weight:600; }
  nav .badge { background:var(--red); color:#fff; border-radius:99px; padding:1px 7px; font-size:11px; margin-left:4px; }
  main { padding:18px 20px 60px; max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 12px; font-size:15px; }
  .card { overflow-x:auto; }
  @media (max-width:700px) { main { padding:12px 10px 50px; } header { padding:10px 12px; } header .muted { display:none; }
    th, td { padding:7px 6px; font-size:13px; } .modal .box { padding:14px; } }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .kpi .v { font-size:26px; font-weight:700; } .kpi .l { color:var(--muted); font-size:12px; }
  .kpi.kg .v { color:var(--green); } .kpi.ka .v { color:var(--amber); } .kpi.kr .v { color:var(--red); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; background:#f8fafc; }
  tr.click { cursor:pointer; } tr.click:hover td { background:#f8fafc; }
  .chip { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; font-weight:600; background:var(--sbg); color:#334155; white-space:nowrap; }
  .chip.completed,.chip.ok { background:var(--gbg); color:var(--green); }
  .chip.partial,.chip.review,.chip.in_progress,.chip.due { background:var(--abg); color:var(--amber); }
  .chip.missed,.chip.rejected,.chip.fraud { background:var(--rbg); color:var(--red); }
  .flag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:6px; background:var(--abg); color:var(--amber); margin:1px 2px 1px 0; }
  .flag.f { background:var(--rbg); color:var(--red); }
  .muted { color:var(--muted); } .r { text-align:right; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .row > * { flex:0 0 auto; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  input, select { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fff; }
  .btn { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn.s { background:#fff; color:var(--text); border:1px solid var(--line); font-weight:500; }
  .btn.d { background:var(--red); } .btn.g { background:var(--green); }
  .btn.xs { padding:4px 8px; font-size:12px; }
  .bar { height:7px; background:var(--sbg); border-radius:99px; overflow:hidden; min-width:80px; }
  .bar i { display:block; height:100%; background:var(--green); }
  .rgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
  .rcard { background:#fff; border:2px solid var(--line); border-radius:14px; padding:16px; cursor:pointer; transition:.15s; }
  .rcard:hover { border-color:var(--brand); box-shadow:0 6px 18px rgba(3,105,161,.12); }
  .rname { font-size:18px; font-weight:700; margin-bottom:4px; }
  .rstats { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 8px; }
  .rstat { border:1px solid var(--line); background:var(--sbg); border-radius:99px; padding:5px 12px; font-size:13px; font-weight:600; cursor:pointer; color:var(--text); }
  .rstat.need { background:var(--rbg); color:var(--red); border-color:#fca5a5; } .rstat.plain { cursor:default; }
  .ropen { color:var(--brand); font-weight:700; text-align:right; }
  .rhead { display:flex; justify-content:space-between; align-items:center; gap:12px; background:linear-gradient(120deg,#0c4a6e,#0369a1); color:#fff;
    border-radius:14px; padding:18px 20px; margin:12px 0; flex-wrap:wrap; }
  .rhead.new { background:linear-gradient(120deg,#14532d,#15803d); }
  .rhsmall { font-size:12px; letter-spacing:1.5px; font-weight:700; opacity:.8; } .rhname { font-size:24px; font-weight:800; margin:2px 0 4px; }
  .stepsbar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .stp { border:2px solid var(--line); background:#fff; border-radius:99px; padding:8px 16px; font-size:14px; font-weight:700; cursor:pointer; color:var(--muted); }
  .stp.on { border-color:var(--brand); background:var(--brand); color:#fff; } .stp.off { cursor:default; }
  .stp.todo:not(.on) { border-color:#fca5a5; color:var(--red); } .stp.ok:not(.on) { border-color:#86efac; color:var(--green); }
  .arrow { color:var(--muted); font-weight:700; }
  .forroute { background:#e0f2fe; color:#075985; padding:2px 10px; border-radius:8px; }
  .colh { margin:4px 0 10px; font-size:14px; color:#334155; }
  .seqn { display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--brand); color:#fff; font-weight:700; font-size:13px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; } @media (max-width:800px){ .grid2 { grid-template-columns:1fr; } }
  .days label { display:inline-flex; align-items:center; gap:3px; margin-right:6px; color:var(--text); font-size:13px; }
  .modal { position:fixed; inset:0; background:rgba(15,23,42,.55); display:flex; align-items:center; justify-content:center; z-index:30; padding:16px; }
  .modal .box { background:#fff; border-radius:14px; max-width:860px; width:100%; max-height:92vh; overflow:auto; padding:20px; }
  .modal .box h2 { margin:0 0 12px; font-size:18px; }
  .media { width:100%; max-height:62vh; background:#000; border-radius:10px; object-fit:contain; }
  .login { max-width:360px; margin:80px auto; }
  .login input { width:100%; margin-bottom:12px; }
  .empty { color:var(--muted); padding:24px; text-align:center; }
  .help { color:var(--muted); font-size:13px; margin:-4px 0 12px; }
  #toast { position:fixed; right:20px; bottom:20px; background:#0f172a; color:#fff; padding:10px 14px; border-radius:10px; opacity:0; transition:.2s; z-index:60; }
  #toast.show { opacity:1; } #toast.err { background:var(--red); }
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script>
const { sb, esc, fmtDate, fmtTime, fmtDateTime, toast, FLAG_TEXT, FRAUD_FLAGS } = SSP;
const root = document.getElementById("root");
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let tab = "today", cache = {}, me = null;
const todayISO = () => SSP.isoDateIST(new Date());
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00+05:30"); d.setDate(d.getDate() + n); return SSP.isoDateIST(d); };
const dayStart = (iso) => iso + "T00:00:00+05:30";
const friendly = (e) => (e?.code === "23505" && /routes_unique_active/.test(e.message || "")) ? "A route with the same name, start date and start time already exists." : (e?.message || String(e));
const q = async (p) => { const { data, error } = await p; if (error) { toast(friendly(error), "err"); throw error; } return data; };
const flagHtml = (fl) => (fl || []).map((f) => `<span class="flag ${["OLD_QR","UNKNOWN_QR"].includes(f) ? "f" : ""}" title="${esc(FLAG_TEXT[f] || f)}">${esc(FLAG_TEXT[f] || f)}</span>`).join("");
const STATUS_TEXT = { completed:"Completed", partial:"Partly done", missed:"Missed", in_progress:"In progress", due:"Due now", upcoming:"Upcoming",
                      ok:"OK", review:"Check", rejected:"Rejected" };
const REASON_TEXT = { TORN: "🩹 QR torn / missing", DIRTY: "🌫️ QR dirty / faded", DARK: "🌙 Too dark", CAMERA: "📵 Camera problem", OTHER: "❓ Other" };
const reasonHtml = (s) => s.reason ? `<div style="margin-top:4px;font-size:12px"><b>${REASON_TEXT[s.reason] || esc(s.reason)}</b>${s.note ? ` – “${esc(s.note)}”` : ""}</div>` : "";
const chip = (s) => `<span class="chip ${s}">${STATUS_TEXT[s] || s}</span>`;

// ---------------- Auth ----------------
async function boot() {
  if (!sb) { root.innerHTML = `<div class="empty">Setup pending: Supabase keys are not configured in config.js.</div>`; return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return location.replace("index.html#committee");
  const ok = await sb.rpc("is_admin");
  if (!ok.data) return location.replace("index.html");
  me = session.user;
  const t = await sb.rpc("server_now"); if (t.data) SSP.syncServer(t.data);
  shell();
}
function renderLogin(msg) {
  root.innerHTML = `<div class="login card"><h3>Serenity Space · Patrol Admin</h3>
    <label>Email</label><input id="em" type="email" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="go" style="width:100%">Log in</button>
    ${msg ? `<p style="color:var(--red)">${esc(msg)}</p>` : ""}</div>`;
  document.getElementById("go").onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    if (error) return renderLogin(error.message); boot();
  };
}
async function logout() { await sb.auth.signOut(); location.replace("index.html"); }

// ---------------- Shell ----------------
const TABS = [["today","Today"],["review","Review"],["checkpoints","Checkpoints & QR"],["routes","Routes & times"],["guards","Guards"],["reports","Reports"],["settings","Settings"]];
function shell() {
  root.innerHTML = `<header><b>Serenity Space · Guard Patrol</b><span class="sp"></span>
      <span class="clk" id="clk"></span><span class="muted" style="color:#94a3b8">${esc(me.email)}</span><button onclick="logout()">Log out</button></header>
    <nav id="nav"></nav><main id="main"></main><div id="toast"></div>`;
  setInterval(() => { const c = document.getElementById("clk"); if (c) c.textContent = "Server time " + fmtDateTime(SSP.serverNow()); }, 1000);
  go(tab);
}
async function go(t) {
  if (t === "routes" && typeof RT !== "undefined") RT = { id: null, step: "details" };
  tab = t;
  const pending = await sb.from("scans").select("id", { count:"exact", head:true }).is("reviewed_at", null)
    .or("status.eq.review,flags.ov.{OLD_QR,UNKNOWN_QR}").gte("scanned_at", new Date(Date.now() - 14 * 864e5).toISOString());
  document.getElementById("nav").innerHTML = TABS.map(([k, l]) =>
    `<button class="${k === t ? "on" : ""}" onclick="go('${k}')">${l}${k === "review" && pending.count ? `<span class="badge">${pending.count}</span>` : ""}</button>`).join("");
  const m = document.getElementById("main"); m.innerHTML = `<div class="empty">Loading…</div>`;
  try { await VIEWS[t](m); } catch (e) { m.innerHTML = `<div class="empty">Could not load: ${esc(e.message || e)}</div>`; }
}
function modal(html) {
  const el = document.createElement("div"); el.className = "modal";
  el.innerHTML = `<div class="box">${html}</div>`;
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  document.body.appendChild(el); return el;
}
const closeModal = () => document.querySelectorAll(".modal").forEach((m) => m.remove());

async function lookups() {
  const [cps, routes, guards] = await Promise.all([
    q(sb.from("checkpoints").select("*").order("name")),
    q(sb.from("routes").select("*").order("name")),
    q(sb.from("guards").select("*").order("code")),
  ]);
  cache = { cps, routes, guards }; return cache;
}

// ---------------- Views ----------------
const VIEWS = {};

VIEWS.today = async (m, dateISO) => {
  const date = dateISO || m.dataset.date || todayISO(); m.dataset.date = date;
  await q(sb.rpc("ensure_rounds", { p_from: addDays(date, -1), p_to: date }));
  const [rounds, scans] = await Promise.all([
    q(sb.from("round_status").select("*").eq("round_date", date).order("due_start")),
    q(sb.from("scans").select("id,flags,status,scanned_at,round_id").gte("scanned_at", dayStart(date)).lt("scanned_at", dayStart(addDays(date, 1)))),
  ]);
  const n = (s) => rounds.filter((r) => r.status === s).length;
  const fraud = scans.filter((s) => (s.flags || []).some((f) => ["OLD_QR","UNKNOWN_QR"].includes(f))).length;
  const past = rounds.filter((r) => !["upcoming","due","in_progress"].includes(r.status));
  const pct = past.length ? Math.round(100 * n("completed") / past.length) : null;
  m.innerHTML = `
    <div class="row" style="margin-bottom:14px"><div><label>Date</label><input type="date" id="dt" value="${date}"></div>
      <button class="btn s" onclick="go('today')">Refresh</button><span class="muted">${fmtDate(date + "T12:00:00+05:30")}</span></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${rounds.length}</div><div class="l">Rounds scheduled</div></div>
      <div class="kpi kg"><div class="v">${n("completed")}</div><div class="l">Completed</div></div>
      <div class="kpi ka"><div class="v">${n("partial")}</div><div class="l">Partly done</div></div>
      <div class="kpi kr"><div class="v">${n("missed")}</div><div class="l">Missed</div></div>
      <div class="kpi ka"><div class="v">${scans.filter((s) => s.status === "review").length}</div><div class="l">Scans to check</div></div>
      <div class="kpi kr"><div class="v">${fraud}</div><div class="l">Fake / old QR attempts</div></div>
      <div class="kpi ${pct === null ? "" : pct >= 90 ? "kg" : pct >= 70 ? "ka" : "kr"}"><div class="v">${pct === null ? "–" : pct + "%"}</div><div class="l">Completion (finished rounds)</div></div>
    </div>
    <div class="card"><h3>Rounds</h3>${rounds.length ? `<table><tr><th>Time</th><th>Route</th><th>Status</th><th>Progress</th><th>Guard</th><th>Last scan</th><th>Flags</th></tr>
      ${rounds.map((r) => `<tr class="click" onclick="roundDetail('${r.id}')">
        <td><b>${fmtTime(r.due_start)}</b>–${fmtTime(r.due_end)}</td><td>${esc(r.route_name)}</td><td>${chip(r.status)}</td>
        <td><div class="bar"><i style="width:${r.total ? 100 * r.done / r.total : 0}%"></i></div><span class="muted">${r.done}/${r.total}</span></td>
        <td>${esc(r.started_by_name || r.assigned_guard_name || "–")}</td><td>${r.last_scan ? fmtTime(r.last_scan, true) : "–"}</td>
        <td>${r.flagged ? `<span class="flag">${r.flagged} to check</span>` : ""}${r.rejected ? `<span class="flag f">${r.rejected} rejected</span>` : ""}</td></tr>`).join("")}</table>`
      : `<div class="empty">No rounds for this date. Set up routes and times first.</div>`}</div>`;
  document.getElementById("dt").onchange = (e) => VIEWS.today(m, e.target.value);
};

async function roundDetail(id) {
  const [r] = await q(sb.from("round_status").select("*").eq("id", id));
  const [rcs, scans] = await Promise.all([
    q(sb.from("route_checkpoints").select("seq, checkpoints(id,name,area)").eq("route_id", r.route_id).order("seq")),
    q(sb.from("scans").select("*, guards(code,name), checkpoints(name), challenges(code)").eq("round_id", id).order("scanned_at")),
  ]);
  const rows = rcs.map((rc) => {
    const s = scans.find((x) => x.checkpoint_id === rc.checkpoints.id && x.status !== "rejected");
    return `<tr><td>${rc.seq}</td><td>${esc(rc.checkpoints.name)}<br><span class="muted">${esc(rc.checkpoints.area || "")}</span></td>
      <td>${s ? `<b>${fmtTime(s.scanned_at, true)}</b>` : `<span class="chip missed">Not scanned</span>`}</td>
      <td>${s ? chip(s.status) + " " + flagHtml(s.flags) + reasonHtml(s) : ""}</td>
      <td>${s?.distance_m != null ? Math.round(s.distance_m) + " m" : ""}</td>
      <td>${s ? mediaBtn(s) : ""}</td></tr>`;
  }).join("");
  const rej = scans.filter((s) => s.status === "rejected");
  modal(`<h2>${esc(r.route_name)} · ${fmtDate(r.due_start)} ${fmtTime(r.due_start)}–${fmtTime(r.due_end)} ${chip(r.status)}</h2>
    <p class="muted">Guard: ${esc(r.started_by_name || r.assigned_guard_name || "–")} · ${r.done}/${r.total} checkpoints</p>
    <table><tr><th>#</th><th>Checkpoint</th><th>Server time</th><th>Result</th><th>From point</th><th>Proof</th></tr>${rows}</table>
    ${rej.length ? `<h3 style="margin-top:18px">Rejected attempts</h3><table><tr><th>Time</th><th>Guard</th><th>Checkpoint</th><th>Reason</th><th>Proof</th></tr>
      ${rej.map((s) => `<tr><td>${fmtTime(s.scanned_at, true)}</td><td>${esc(s.guards?.code)}</td><td>${esc(s.checkpoints?.name || "–")}</td><td>${flagHtml(s.flags)}</td><td>${mediaBtn(s)}</td></tr>`).join("")}</table>` : ""}
    <p style="text-align:right"><button class="btn s" onclick="closeModal()">Close</button></p>`);
}

function mediaBtn(s) {
  if (!s.media_path) return s.media_deleted ? `<span class="muted">Deleted (old)</span>` : `<span class="muted">None</span>`;
  return `<button class="btn s xs" onclick="viewMedia('${s.id}')">${s.media_type === "video" ? "🎥 Video" : "📷 Photo"}</button>`;
}
async function viewMedia(scanId) {
  const [s] = await q(sb.from("scans").select("*, guards(code,name), checkpoints(name,lat,lng), challenges(code, issued_at)").eq("id", scanId));
  const { data, error } = await sb.storage.from("patrol-media").createSignedUrl(s.media_path, 3600);
  if (error) return toast(error.message, "err");
  const map = s.lat != null ? `<a href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" rel="noopener">Open phone location in map</a>` : "No GPS";
  const el = modal(`<h2>${esc(s.checkpoints?.name || "Unknown QR")} · ${fmtDateTime(s.scanned_at)}</h2>
    ${s.media_type === "video" ? `<video class="media" src="${data.signedUrl}" controls autoplay playsinline></video>` : `<img class="media" src="${data.signedUrl}">`}
    <div class="card" style="margin-top:12px">
      ${s.reason ? `<div style="background:var(--abg);padding:10px;border-radius:8px;margin-bottom:8px"><b>Guard could not scan the QR.</b> Reason: ${REASON_TEXT[s.reason] || esc(s.reason)}${s.note ? `<br>Guard said: “${esc(s.note)}”` : ""}<br><span class="muted">Check the video shows the right place. If the QR is damaged, print a new one (Checkpoints → 🖨 QR).</span></div>` : ""}
      <b>Verify:</b> the code burned on the ${s.media_type} must read <b style="font-size:18px;color:var(--brand)">${esc(s.challenges?.code || "?")}</b>
      and the QR must be on a wall/post — not on a phone screen or paper in the hand.
      <div class="muted" style="margin-top:6px">Guard ${esc(s.guards?.code)} · ${esc(s.guards?.name)} · ${chip(s.status)} ${flagHtml(s.flags)}<br>
      Distance from checkpoint: ${s.distance_m != null ? Math.round(s.distance_m) + " m" : "–"} · GPS accuracy: ${s.accuracy_m != null ? "±" + Math.round(s.accuracy_m) + " m" : "–"} · QR seen in ${s.qr_frames ?? "–"} frame(s) · ${map}
      ${s.review_note ? `<br>Note: ${esc(s.review_note)}` : ""}</div></div>
    <div class="row" style="justify-content:flex-end">
      <input id="note" placeholder="Note (optional)" style="flex:1;min-width:200px">
      <button class="btn g" onclick="review('${s.id}','ok')">✓ Genuine</button>
      <button class="btn d" onclick="review('${s.id}','rejected')">✕ Not genuine</button>
      <button class="btn s" onclick="closeModal()">Close</button></div>`);
}
async function review(id, status) {
  const note = document.getElementById("note")?.value || null;
  await q(sb.rpc("admin_review_scan", { p_id: id, p_status: status, p_note: note }));
  toast(status === "ok" ? "Marked genuine" : "Marked not genuine"); closeModal(); go(tab);
}

VIEWS.review = async (m) => {
  const since = new Date(Date.now() - 14 * 864e5).toISOString();
  const rows = await q(sb.from("scans").select("*, guards(code,name), checkpoints(name), challenges(code)")
    .is("reviewed_at", null).or("status.eq.review,flags.ov.{OLD_QR,UNKNOWN_QR}").gte("scanned_at", since)
    .order("scanned_at", { ascending:false }).limit(200));
  m.innerHTML = `<div class="card"><h3>Scans to check (last 14 days)</h3>
    <p class="help">Open the photo/video, confirm the burned-in code matches and the QR is on the wall at the right place, then mark it. Red items are attempts with an old or fake QR — strong sign of cheating.</p>
    ${rows.length ? `<table><tr><th>Server time</th><th>Guard</th><th>Checkpoint</th><th>Status</th><th>Why</th><th>Proof</th></tr>

function setLoc(id) {
  const c = cache.cps.find((x) => x.id === id);
  if (!navigator.geolocation) return toast("This device has no GPS", "err");
  const el = modal(`<h2>📍 ${esc(c.name)}</h2>
    <p>Stand right next to where the QR will be fixed. Use your <b>mobile phone</b> with Location on — a computer gives only a rough location.</p>
    <p id="gs" style="font-size:18px">Waiting for GPS…</p><p id="gw" class="help"></p>
    <div class="row" style="justify-content:flex-end"><button class="btn s" id="gcancel">Cancel</button><button class="btn" id="gsave" disabled>Save this location</button></div>`);
  const gsEl = el.querySelector("#gs"), gwEl = el.querySelector("#gw"), btn = el.querySelector("#gsave");
  const reads = []; let fix = null, w = null;
  const stop = () => { if (w !== null) navigator.geolocation.clearWatch(w); w = null; };
  const onPos = (p) => {
    reads.push(p.coords);
    const best = Math.min(...reads.map((x) => x.accuracy));
    const good = reads.filter((r) => r.accuracy <= Math.max(25, best * 1.5));
    const wsum = good.reduce((a, r) => a + 1 / r.accuracy, 0);
    fix = { lat: good.reduce((a, r) => a + r.latitude / r.accuracy, 0) / wsum,
            lng: good.reduce((a, r) => a + r.longitude / r.accuracy, 0) / wsum, best };
    gsEl.innerHTML = `${reads.length} reading(s) · accuracy ±${Math.round(best)} m<br><span class="muted">${fix.lat.toFixed(6)}, ${fix.lng.toFixed(6)}</span>`;
    gwEl.innerHTML = best > 50 ? "⚠️ GPS is weak (more than 50 m). Wait a few seconds or step into the open for a better reading. You can still save."
                   : best > 20 ? "Getting better… waiting a few seconds improves accuracy." : "✅ Good accuracy.";
    btn.disabled = false;
  };
  const onErr = (e) => { if (!fix) gsEl.textContent = "GPS error: " + e.message + (e.code === 1 ? " — allow Location for this site." : ""); };
  navigator.geolocation.getCurrentPosition(onPos, onErr, { enableHighAccuracy:true, maximumAge:0, timeout:20000 });
  w = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy:true, maximumAge:0, timeout:30000 });
  el.querySelector("#gcancel").onclick = () => { stop(); closeModal(); };
  el.addEventListener("click", (e) => { if (e.target === el) stop(); });
  btn.onclick = async () => {
    if (!fix) return;
    btn.disabled = true; btn.textContent = "Saving…";
    stop();
    const radius = Math.max(c.radius_m, Math.min(60, Math.round(fix.best * 1.5)));
    const { data, error } = await sb.from("checkpoints").update({ lat: fix.lat, lng: fix.lng, radius_m: radius }).eq("id", id).select("id");
    if (error || !data?.length) { btn.disabled = false; btn.textContent = "Save this location"; return toast(error?.message || "Could not save — please log in again", "err"); }
    closeModal(); toast(`Location saved (check radius ${radius} m)`); go("checkpoints");
  };
}
async function rekey(id) {

function printQr(ids) {

    return `<div class="c"><div class="h">SERENITY SPACE</div><div class="s">PATROL CHECKPOINT · પેટ્રોલ ચેકપોઇન્ટ</div>
      <div class="n">${esc(c.name)}</div><div class="a">${esc(c.area || "")}</div>

      <div class="f">Scan only with the Serenity Space Patrol app · Do not remove or copy<br>આ QR દૂર કરશો નહીં · ફક્ત પેટ્રોલ એપથી સ્કેન કરવું</div>
      <div class="v">v${c.qr_version} · printed ${fmtDate(new Date())}</div></div>`;
  }).join("");
  const w = window.open("", "_blank");
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Patrol QR codes</title><style>
    @page { size:A4; margin:10mm; } body { margin:0; font-family:system-ui,"Noto Sans Gujarati",sans-serif; }
    .c { height:136mm; border:2px dashed #94a3b8; border-radius:6mm; padding:8mm; text-align:center; page-break-inside:avoid; margin-bottom:5mm; display:flex; flex-direction:column; align-items:center; justify-content:space-between; }
    .h { font-size:22pt; font-weight:800; letter-spacing:2px; color:#0f172a; } .s { font-size:11pt; color:#475569; }
    .n { font-size:24pt; font-weight:800; margin-top:2mm; } .a { font-size:13pt; color:#334155; }
    .q svg { width:72mm; height:72mm; } .f { font-size:9.5pt; color:#334155; } .v { font-size:8pt; color:#94a3b8; }
  </style></head><body>${cards}<script>setTimeout(()=>print(),400)<\/script></body></html>`);
  w.document.close();
}

const MEDIA_TEXT = { auto: "Auto (as in Settings)", photo: "📷 Photo", video: "🎥 10-sec video" };
const nowHHMM = () => { const p = SSP.fmtTime(new Date(Date.now() + 15 * 60000)); const [h, mm] = p.split(":").map(Number); const q15 = Math.floor(mm / 15) * 15; return `${String(h).padStart(2, "0")}:${String(q15).padStart(2, "0")}`; };

const fmtD = (d) => (d ? fmtDate(d + "T12:00:00+05:30") : "–");
const mediaSel = (idAttr, v, autoLabel) => `<select ${idAttr}>${["auto", "photo", "video"].map((k) =>

// Which route is open in the Routes tab: id = null (list), "new" (wizard) or a route id; step = details / places / times
let RT = { id: null, step: "details" };
function openRoute(id, step) { RT = { id, step: step || "details" }; VIEWS.routes(document.getElementById("main")); window.scrollTo(0, 0); }

VIEWS.routes = async (m) => {
  const { cps, routes: allRoutes, guards } = await lookups();
  const [allRc, allSch] = await Promise.all([
    q(sb.from("route_checkpoints").select("route_id, checkpoint_id, seq, media").order("seq")),
    q(sb.from("schedules").select("*").order("start_time")),
  ]);
  if (RT.id === "new") return renderNewRoute(m);
  const sel = RT.id && allRoutes.find((r) => r.id === RT.id && r.active);
  if (!sel) return renderRouteList(m, allRoutes, allRc, allSch);
  renderRouteDetail(m, sel, cps, guards, allRc.filter((x) => x.route_id === sel.id), allSch.filter((x) => x.route_id === sel.id));
};

            <td>${mediaSel(`onchange="setCpMedia('${rc.checkpoint_id}', this.value)"`, rc.media, "Same as route")}</td>
            <td class="r" style="white-space:nowrap"><button class="btn s xs" onclick="moveCp(${i},-1)" ${i ? "" : "disabled"}>↑</button><button class="btn s xs" onclick="moveCp(${i},1)" ${i < nP - 1 ? "" : "disabled"}>↓</button>
            <button class="btn s xs" title="Remove from route" onclick="moveCp(${i},0)">✕</button></td></tr>`).join("")}</table>`
          : `<div class="empty" style="border:2px dashed var(--line);border-radius:10px">No places yet.<br>Click <b>＋ Add</b> on the right →</div>`}</div>
        <div><h4 class="colh">➕ Add places (${avail.length} available)
            ${avail.length > 1 ? `<button class="btn s xs" style="float:right" onclick="addAllCps()">＋ Add all</button>` : ""}</h4>
          ${avail.length ? `<table>${avail.map((c) => `<tr><td><b>${esc(c.name)}</b><br><span class="muted" style="font-size:12px">${esc(c.area || "")}</span></td>
            <td class="r"><button class="btn xs" onclick="addCpToRoute('${c.id}')">＋ Add</button></td></tr>`).join("")}</table>`
          : `<div class="empty">All checkpoints are in this route. Need another? Add it in <a href="#" onclick="go('checkpoints');return false">Checkpoints &amp; QR</a>.</div>`}</div>
      </div>`}
      ${nav("details", "times", "Next: Round times")}</div>`;
  } else {
    const perDay = scheds.filter((s) => s.active).length;
    body = `<div class="card"><h3>Step 3 of 3 · Round times for ${forRoute}</h3>
      <p class="help">Each time below is one round per day. The guard must visit all ${nP} place${nP === 1 ? "" : "s"} within the window.</p>
      <div class="grid2">
        <div><h4 class="colh">⏰ Times (${perDay} rounds per day)</h4>
          <table><tr><th>Start</th><th>Window</th><th>Days</th><th>Guard</th><th></th></tr>
          ${scheds.map((s) => `<tr style="${s.active ? "" : "opacity:.5"}"><td><b>${s.start_time.slice(0, 5)}</b></td><td>${s.window_minutes} min</td>
            <td>${s.days.length === 7 ? "Daily" : s.days.map((d) => DAYS[d]).join(" ")}</td>
            <td>${esc(guards.find((g) => g.id === s.guard_id)?.code || "Any")}</td>
            <td class="r" style="white-space:nowrap"><button class="btn s xs" onclick="toggleSched('${s.id}', ${!s.active})">${s.active ? "Pause" : "Resume"}</button>
            <button class="btn s xs" onclick="delSched('${s.id}')">✕</button></td></tr>`).join("") || `<tr><td class="muted" colspan="5" style="padding:20px;text-align:center">No times yet – add them on the right →</td></tr>`}</table></div>
        <div><h4 class="colh">➕ Add times</h4>
          <div class="row"><div><label>From</label><input id="sf" type="time" value="22:00"></div><div><label>To</label><input id="st" type="time" value="06:00"></div>
            <div><label>Every (minutes)</label><input id="se" type="number" value="120" style="width:90px"></div>
            <div><label>Time to finish (min)</label><input id="sw" type="number" value="45" style="width:90px"></div></div>
          <div class="days" style="margin:10px 0">${DAYS.map((d, i) => `<label><input type="checkbox" class="sd" value="${i}" checked>${d}</label>`).join("")}</div>
          <div class="row"><div><label>Guard (optional)</label><select id="sg"><option value="">Any guard on duty</option>${guards.filter((g) => g.active).map((g) => `<option value="${g.id}">${esc(g.code)} · ${esc(g.name)}</option>`).join("")}</select></div>
            <button class="btn" onclick="addScheds()">＋ Add times</button></div>
          <p class="help" id="schedPrev" style="margin-top:8px"></p>
          <p class="help">Example: From 22:00 To 06:00 Every 120 → rounds at 22:00, 00:00, 02:00, 04:00, 06:00. For a single round set From = To.</p></div>
      </div>
      ${nav("places", null)}</div>`;
  }
  m.innerHTML = head + body;
  window._rcs = rcs.map((r) => ({ checkpoint_id: r.checkpoint_id, media: r.media || "auto" })); window._route = sel.id;
  if (step === "times") {
    const prev = () => { const r = schedRows(); schedPrev.innerHTML = r.length ? `Will add <b>${r.length}</b> round${r.length === 1 ? "" : "s"}: ${r.map((x) => x.start_time).join(", ")}` : ""; };
    ["sf", "st", "se"].forEach((id) => (document.getElementById(id).oninput = prev)); prev();
  }
}

async function addRoute() {
  if (!rnew.value.trim()) return toast("Enter a route name", "err");
  if (!rstart.value || !rstartt.value) return toast("Choose a start date and time", "err");
  if (rend.value && rend.value < rstart.value) return toast("End date is before start date", "err");
  const dup = cache.routes.find((r) => r.active && r.name.trim().toLowerCase() === rnew.value.trim().toLowerCase() && r.start_date === rstart.value && hm(r.start_time) === rstartt.value);
  if (dup) return toast("A route with the same name, start date and start time already exists.", "err");
  const [r] = await q(sb.from("routes").insert({ name: rnew.value.trim(), start_date: rstart.value, start_time: rstartt.value, end_date: rend.value || null, media_mode: rmedia.value }).select());
  toast(`Route “${r.name}” created. Now add its places.`);
  openRoute(r.id, "places");
}
async function saveRoute(id) {
  const $ = (x) => document.getElementById(x), name = $("rn").value.trim(), sd = $("rs").value, ed = $("re").value, stt = $("rst").value || "00:00";
  if (!name || !sd) return toast("Name and start date are required", "err");
  const dup = cache.routes.find((r) => r.id !== id && r.active && r.name.trim().toLowerCase() === name.toLowerCase() && r.start_date === sd && hm(r.start_time) === stt);
  if (dup) return toast("A route with the same name, start date and start time already exists.", "err");
  if (ed && ed < sd) return toast("End date is before start date", "err");
  await q(sb.from("routes").update({ name, start_date: sd, start_time: stt, end_date: ed || null, media_mode: $("rm").value,
    name_hi: val("rt_hi"), name_gu: val("rt_gu") }).eq("id", id));
  toast("Details saved"); openRoute(id, "details");
}
async function toggleRoute(id, active) {
  const r = cache.routes.find((x) => x.id === id);
  if (!active && !confirm(`Deactivate "${r.name}"?\n\nIts upcoming rounds are removed and it will not appear on future days. Past rounds stay in Reports. You can activate it again later.`)) return;
  if (active) {
    const dup = cache.routes.find((x) => x.id !== id && x.active && x.name.trim().toLowerCase() === r.name.trim().toLowerCase() && x.start_date === r.start_date && hm(x.start_time) === hm(r.start_time));
    if (dup) return toast("An active route with the same name, start date and start time already exists. Change its start time first.", "err");
  }
  await q(sb.from("routes").update({ active }).eq("id", id));
  toast(active ? "Route activated" : "Route deactivated");
  active ? openRoute(id, "details") : routeList();
}
async function setCpMedia(cpId, media) {
  await q(sb.from("route_checkpoints").update({ media }).eq("route_id", window._route).eq("checkpoint_id", cpId));
  const x = window._rcs.find((r) => r.checkpoint_id === cpId); if (x) x.media = media;
  toast(media === "video" ? "This place will need a 10-sec video" : media === "photo" ? "This place will need a photo" : "Same as route");
}
async function saveRouteCps(list) {
  await q(sb.from("route_checkpoints").delete().eq("route_id", window._route));
  if (list.length) await q(sb.from("route_checkpoints").insert(list.map((c, k) => ({ route_id: window._route, checkpoint_id: c.checkpoint_id, seq: k + 1, media: c.media }))));
  openRoute(window._route, "places");
}
async function moveCp(i, dir) {
  const list = window._rcs.map((x) => ({ ...x }));
  if (dir === 0) list.splice(i, 1);
  else { const j = i + dir; [list[i], list[j]] = [list[j], list[i]]; }
  await saveRouteCps(list);
}
async function addCpToRoute(cpId) {
  const list = window._rcs.map((x) => ({ ...x })); list.push({ checkpoint_id: cpId, media: "auto" });
  await saveRouteCps(list); toast("Place added");
}
async function addAllCps() {
  const list = window._rcs.map((x) => ({ ...x }));
  cache.cps.filter((c) => c.active && !list.some((x) => x.checkpoint_id === c.id)).forEach((c) => list.push({ checkpoint_id: c.id, media: "auto" }));
  await saveRouteCps(list); toast("All places added");
}
function schedRows() {
  const days = [...document.querySelectorAll(".sd:checked")].map((x) => +x.value);
  const toMin = (v) => +v.slice(0, 2) * 60 + +v.slice(3, 5);
  if (!sf.value || !st.value) return [];
  let a = toMin(sf.value), b = toMin(st.value), every = Math.max(15, +se.value || 60);
  if (b < a) b += 1440;
  const rows = [];
  for (let x = a; x <= b && rows.length <= 48; x += every) { const mm = x % 1440; rows.push({ route_id: window._route, start_time: `${String(Math.floor(mm / 60)).padStart(2, "0")}:${String(mm % 60).padStart(2, "0")}`, window_minutes: +sw.value || 45, days, guard_id: sg.value || null }); }
  return rows;
}
async function addScheds() {
  const rows = schedRows();
  if (!rows.length || !rows[0].days.length) return toast("Pick at least one day", "err");
  if (rows.length > 48) return toast("Too many times — increase 'Every'", "err");
  await q(sb.from("schedules").insert(rows)); toast(`${rows.length} round time(s) added`); openRoute(window._route, "times");
}
async function toggleSched(id, active) { await q(sb.from("schedules").update({ active }).eq("id", id)); openRoute(window._route, "times"); }
async function delSched(id) { if (!confirm("Delete this time? Past rounds stay in the records.")) return; await q(sb.from("schedules").delete().eq("id", id)); openRoute(window._route, "times"); }

// ---------- Guards ----------
VIEWS.guards = async (m) => {
  const { guards } = await lookups();
  m.innerHTML = `<div class="card"><h3>Add guard</h3>
    <div class="row"><div><label>Guard code (login)</label><input id="gc" placeholder="G01" style="width:90px"></div><div><label>Name</label><input id="gn"></div>
      <div><label>Mobile</label><input id="gp" style="width:130px"></div><div><label>Agency</label><input id="gag" style="width:140px"></div>
      <div><label>6-digit PIN</label><input id="gpin" inputmode="numeric" maxlength="6" style="width:100px"></div><button class="btn" onclick="addGuard()">Add guard</button></div>
    <p class="help" style="margin-top:8px">The guard logs in with the code + PIN. The account locks to the first phone used; use <b>Reset phone</b> when a guard changes phones.</p></div>
    <div class="card"><h3>Guards (${guards.length})</h3>${guards.length ? `<table><tr><th>Code</th><th>Name</th><th>Mobile</th><th>Agency</th><th>Phone lock</th><th>Status</th><th></th></tr>
    ${guards.map((g) => `<tr><td><b>${esc(g.code)}</b></td><td>${esc(g.name)}</td><td>${esc(g.phone || "")}</td><td>${esc(g.agency || "")}</td>
      <td>${g.device_id ? `Locked ${g.device_bound_at ? fmtDate(g.device_bound_at) : ""}` : `<span class="muted">Not yet used</span>`}</td>
      <td>${g.active ? `<span class="chip ok">Active</span>` : `<span class="chip">Inactive</span>`}</td>
      <td class="r"><button class="btn s xs" onclick="resetPin('${g.id}')">Reset PIN</button>
        <button class="btn s xs" onclick="resetPhone('${g.id}')">Reset phone</button>
        <button class="btn s xs" onclick="toggleGuard('${g.id}', ${!g.active})">${g.active ? "Deactivate" : "Activate"}</button></td></tr>`).join("")}</table>`
      : `<div class="empty">No guards yet.</div>`}</div>`;
};
async function fn(body) {
  const { data, error } = await sb.functions.invoke("admin", { body });
  if (error) { let msg = error.message; try { msg = (await error.context.json()).error || msg; } catch (e) {} toast(msg, "err"); throw new Error(msg); }
  if (data?.error) { toast(data.error, "err"); throw new Error(data.error); }
  return data;
}
async function addGuard() {
  await fn({ action:"create_guard", code: gc.value, name: gn.value.trim(), phone: gp.value.trim(), agency: gag.value.trim(), pin: gpin.value.trim() });
  toast("Guard added"); go("guards");
}
async function resetPin(id) { const pin = prompt("New 6-digit PIN"); if (!pin) return; await fn({ action:"set_pin", guard_id:id, pin }); toast("PIN changed"); }
async function resetPhone(id) { if (!confirm("Allow this guard to log in from a new phone? The next phone used will be locked.")) return; await q(sb.rpc("admin_reset_device", { p_guard:id })); toast("Phone reset"); go("guards"); }
async function toggleGuard(id, active) { await q(sb.from("guards").update({ active }).eq("id", id)); go("guards"); }

// ---------- Reports ----------
VIEWS.reports = async (m, from0, to0) => {
  const to = to0 || todayISO(), from = from0 || addDays(to, -6);
  await q(sb.rpc("ensure_rounds", { p_from: from, p_to: to }));
  const [rounds, scans, { guards }] = await Promise.all([
    q(sb.from("round_status").select("*").gte("round_date", from).lte("round_date", to).order("due_start")),
    q(sb.from("scans").select("*, guards(code,name), checkpoints(name)").gte("scanned_at", dayStart(from)).lt("scanned_at", dayStart(addDays(to, 1))).order("scanned_at").limit(10000)),
    lookups(),
  ]);
  const finished = rounds.filter((r) => ["completed","partial","missed"].includes(r.status));
  const c = (s) => finished.filter((r) => r.status === s).length;
  const pct = finished.length ? Math.round(100 * c("completed") / finished.length) : 0;
  const byGuard = guards.map((g) => {
    const s = scans.filter((x) => x.guard_id === g.id);
    return { g, ok: s.filter((x) => x.status === "ok").length, review: s.filter((x) => x.status === "review").length,
      rej: s.filter((x) => x.status === "rejected").length, fraud: s.filter((x) => (x.flags || []).some((f) => ["OLD_QR","UNKNOWN_QR","OUT_OF_ZONE"].includes(f))).length, noqr: s.filter((x) => (x.flags || []).includes("NO_QR")).length,
      rounds: new Set(rounds.filter((r) => r.started_by === g.id).map((r) => r.id)).size };
  }).filter((x) => x.ok + x.review + x.rej > 0 || x.g.active);
  const days = [...new Set(rounds.map((r) => r.round_date))];
  window._report = { rounds, scans, from, to };
  m.innerHTML = `<div class="card"><div class="row"><div><label>From</label><input type="date" id="rf" value="${from}"></div><div><label>To</label><input type="date" id="rt" value="${to}"></div>
      <button class="btn" onclick="VIEWS.reports(document.getElementById('main'), rf.value, rt.value)">Show</button>
      <button class="btn s" onclick="csvRounds()">⬇ Rounds CSV</button><button class="btn s" onclick="csvScans()">⬇ Scans CSV</button></div></div>
    <div class="kpis"><div class="kpi"><div class="v">${finished.length}</div><div class="l">Rounds due (${fmtDate(from + "T12:00:00+05:30")} – ${fmtDate(to + "T12:00:00+05:30")})</div></div>
      <div class="kpi kg"><div class="v">${c("completed")}</div><div class="l">Completed</div></div><div class="kpi ka"><div class="v">${c("partial")}</div><div class="l">Partly done</div></div>
      <div class="kpi kr"><div class="v">${c("missed")}</div><div class="l">Missed</div></div>
      <div class="kpi ${pct >= 90 ? "kg" : pct >= 70 ? "ka" : "kr"}"><div class="v">${pct}%</div><div class="l">Completion</div></div></div>
    <div class="grid2"><div class="card"><h3>By guard</h3><table><tr><th>Guard</th><th class="r">Rounds</th><th class="r">OK scans</th><th class="r">To check</th><th class="r">Rejected</th><th class="r">No-QR</th><th class="r">Warning signs</th></tr>
      ${byGuard.map((x) => `<tr><td>${esc(x.g.code)} · ${esc(x.g.name)}</td><td class="r">${x.rounds}</td><td class="r">${x.ok}</td><td class="r">${x.review}</td><td class="r">${x.rej}</td><td class="r">${x.noqr ? `<span class="chip review">${x.noqr}</span>` : 0}</td>
        <td class="r">${x.fraud ? `<span class="chip fraud">${x.fraud}</span>` : "0"}</td></tr>`).join("")}</table>
      <p class="help" style="margin-top:8px">No-QR = guard used "QR not working" (video + reason). Many of these from one guard is worth a look. Warning signs = old/fake QR, or scanned away from the checkpoint.</p></div>
    <div class="card"><h3>By day</h3><table><tr><th>Date</th><th class="r">Rounds</th><th class="r">Completed</th><th class="r">Partly</th><th class="r">Missed</th></tr>
      ${days.map((d) => { const rr = rounds.filter((r) => r.round_date === d); const k = (s) => rr.filter((r) => r.status === s).length;
        return `<tr><td>${fmtDate(d + "T12:00:00+05:30")}</td><td class="r">${rr.length}</td><td class="r">${k("completed")}</td><td class="r">${k("partial")}</td><td class="r">${k("missed") ? `<b style="color:var(--red)">${k("missed")}</b>` : 0}</td></tr>`; }).join("")}</table></div></div>`;
};
function csv(name, rows) {
  const s = rows.map((r) => r.map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + s], { type:"text/csv" })); a.download = name; a.click();
}
function csvRounds() { const { rounds, from, to } = window._report;
  csv(`Serenity_Space_Patrol_Rounds_${from}_to_${to}.csv`, [["Date","Start","End","Route","Status","Done","Total","Guard","Flagged","Rejected"],
    ...rounds.map((r) => [fmtDate(r.due_start), fmtTime(r.due_start), fmtTime(r.due_end), r.route_name, STATUS_TEXT[r.status], r.done, r.total, r.started_by_name || r.assigned_guard_name || "", r.flagged, r.rejected])]); }
function csvScans() { const { scans, from, to } = window._report;
  csv(`Serenity_Space_Patrol_Scans_${from}_to_${to}.csv`, [["Date","Server time","Guard","Checkpoint","Status","Flags","Distance m","GPS accuracy m","Media"],
    ...scans.map((s) => [fmtDate(s.scanned_at), fmtTime(s.scanned_at, true), s.guards?.code, s.checkpoints?.name || "", STATUS_TEXT[s.status], (s.flags || []).join(" "), s.distance_m ?? "", s.accuracy_m != null ? Math.round(s.accuracy_m) : "", s.media_type])]); }

// ---------- Settings ----------
VIEWS.settings = async (m) => {
  const rows = await q(sb.from("app_settings").select("*").order("key"));
  m.innerHTML = `<div class="card"><h3>Rules</h3><table><tr><th>Setting</th><th>Value</th><th>Meaning</th><th></th></tr>
    ${rows.map((r) => `<tr><td><code>${esc(r.key)}</code></td><td><input id="set_${r.key}" value="${esc(r.value)}" style="width:200px"></td><td class="muted">${esc(r.note || "")}</td>
      <td><button class="btn s xs" onclick="saveSetting('${r.key}')">Save</button></td></tr>`).join("")}</table></div>
    <div class="grid2"><div class="card"><h3>Free up storage</h3><p class="help">Deletes photos/videos older than <b>media_retention_days</b>. Scan records stay.</p>
      <button class="btn s" onclick="cleanup()">Delete old media now</button></div>
    <div class="card"><h3>Add committee admin</h3><div class="row"><div><label>Name</label><input id="an"></div><div><label>Email</label><input id="ae" type="email"></div>
      <div><label>Password (8+)</label><input id="ap" type="text"></div><button class="btn" onclick="addAdmin()">Add</button></div></div></div>`;
};
async function saveSetting(k) { await q(sb.from("app_settings").update({ value: document.getElementById("set_" + k).value.trim() }).eq("key", k)); toast("Saved"); }
async function cleanup() { const r = await fn({ action:"cleanup_media" }); toast(`Deleted ${r.removed} file(s) older than ${r.older_than_days} days`); }
async function addAdmin() { await fn({ action:"create_admin", name: an.value.trim(), email: ae.value.trim(), password: ap.value }); toast("Admin added"); an.value = ae.value = ap.value = ""; }

boot();
</script>
