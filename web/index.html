<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Serenity Space · Patrol</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#f8fafc; --muted:#a5b4c8;
          --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --blue:#38bdf8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text);
    font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Gujarati","Noto Sans Devanagari",sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:14px 14px 40px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .brand { font-weight:800; font-size:19px; }
  .brand small { display:block; color:var(--muted); font-weight:500; font-size:13px; }
  .tools { display:flex; gap:6px; align-items:center; }
  .tools button { background:var(--card); border:2px solid var(--line); color:var(--text); border-radius:12px;
    min-width:46px; height:46px; font-size:17px; font-weight:700; padding:0 8px; }
  .tools button.on { border-color:var(--blue); background:#0c4a6e; }
  .clock { background:var(--card); border-radius:16px; padding:10px 14px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
  .clock .t { font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; }
  .clock .d { color:var(--muted); font-size:13px; text-align:right; }
  .warn { background:#451a03; border:2px solid var(--amber); color:#fde68a; border-radius:14px; padding:12px; margin-bottom:12px; font-size:16px; }
  .card { background:var(--card); border-radius:18px; padding:16px; margin-bottom:12px; }
  /* Next place tile */
  .next { background:linear-gradient(160deg,#0c4a6e,#1e3a8a); border:3px solid var(--blue); border-radius:22px; padding:18px; margin-bottom:12px; text-align:center; }
  .next .lbl { font-size:16px; font-weight:800; letter-spacing:1px; color:#bae6fd; }
  .next .step { display:inline-block; background:rgba(255,255,255,.15); border-radius:99px; padding:3px 12px; font-size:15px; margin-top:4px; }
  .next .ico { font-size:64px; line-height:1; margin:10px 0 4px; }
  .next .name { font-size:30px; font-weight:800; line-height:1.15; }
  .next .area { font-size:17px; color:#cbd5e1; margin-top:2px; }
  .next .vid { display:inline-block; margin-top:8px; background:#7f1d1d; color:#fecaca; padding:4px 12px; border-radius:99px; font-weight:700; }
  .next .due { margin-top:10px; font-size:16px; color:#fde68a; font-weight:700; }
  .big { display:flex; align-items:center; justify-content:center; gap:12px; width:100%; border:0; border-radius:20px; padding:20px;
    font-size:24px; font-weight:800; background:var(--green); color:#052e16; margin-top:14px; box-shadow:0 6px 0 #15803d; }
  .big:active { transform:translateY(3px); box-shadow:0 3px 0 #15803d; }
  .big .i { font-size:34px; }
  .row2 { display:flex; gap:10px; margin-top:12px; }
  .mid { flex:1; border:2px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08); color:#fff; border-radius:16px; padding:12px 8px;
    font-size:16px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .mid .i { font-size:26px; }
  .mid.warnb { border-color:var(--amber); color:#fde68a; }
  .dots { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:6px 0 2px; }
  .dot { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:15px; background:#0b1220; color:var(--muted); border:2px solid var(--line); }
  .dot.ok { background:var(--green); color:#052e16; border-color:var(--green); }
  .dot.cur { border-color:#fff; color:#fff; box-shadow:0 0 0 3px rgba(56,189,248,.5); }
  .status { text-align:center; padding:26px 14px; border-radius:22px; margin-bottom:12px; }
  .status .ico { font-size:70px; line-height:1; }
  .status h2 { margin:10px 0 4px; font-size:26px; }
  .status p { margin:4px 0; color:var(--muted); font-size:18px; }
  .status.done { background:#14532d; } .status.wait { background:var(--card); }
  details { background:var(--card); border-radius:16px; padding:12px 14px; margin-bottom:12px; }
  summary { font-weight:700; font-size:17px; cursor:pointer; }
  ol { margin:8px 0 0; padding:0; list-style:none; }
  ol li { display:flex; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:17px; }
  ol li .n { width:30px; height:30px; border-radius:50%; background:#0b1220; display:grid; place-items:center; font-size:14px; color:var(--muted); flex:none; }
  ol li.ok .n { background:var(--green); color:#052e16; }
  ol li .a { color:var(--muted); font-size:13px; }
  .alerts { display:flex; align-items:center; gap:12px; width:100%; border:2px dashed var(--amber); background:#422006; color:#fde68a; border-radius:18px; padding:14px; font-size:18px; font-weight:800; margin-bottom:12px; text-align:left; }
  .alerts .i { font-size:34px; } .alerts small { display:block; font-weight:500; font-size:14px; color:#fcd34d; }
  .btn { display:block; width:100%; border:0; border-radius:16px; padding:18px; font-size:20px; font-weight:800; background:var(--blue); color:#082f49; margin-top:12px; }
  .btn.ghost { background:none; border:2px solid var(--line); color:var(--text); font-weight:700; font-size:17px; padding:14px; }
  .btn.amber { background:var(--amber); color:#422006; }
  input, textarea { width:100%; padding:14px; font-size:20px; border-radius:14px; border:2px solid var(--line); background:#0b1220; color:var(--text); margin:6px 0 12px; font-family:inherit; }
  textarea { font-size:18px; min-height:80px; }
  label { color:var(--muted); font-size:15px; font-weight:600; }
  select.sel { width:100%; padding:16px; font-size:20px; border-radius:14px; border:2px solid var(--line); background:#0b1220; color:var(--text); margin:6px 0 12px; }
  .seg { display:flex; background:var(--card); border-radius:14px; padding:4px; margin-bottom:12px; }
  .seg button { flex:1; border:0; background:none; color:var(--muted); padding:12px; border-radius:11px; font-size:17px; font-weight:700; }
  .seg button.on { background:var(--blue); color:#082f49; }
  .foot { text-align:center; color:var(--muted); font-size:13px; margin-top:20px; }
  .link { background:none; border:0; color:var(--muted); text-decoration:underline; font-size:15px; padding:10px; }
  /* Scanner */
  #scan { position:fixed; inset:0; background:#000; display:none; z-index:10; }
  #scan canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #scan video { position:absolute; width:1px; height:1px; opacity:0; }
  #scan .top { position:absolute; left:0; right:0; top:0; padding:12px; display:flex; justify-content:space-between; align-items:center; z-index:2; }
  #scan .hint { position:absolute; left:12px; right:12px; bottom:150px; text-align:center; font-size:23px; font-weight:800; text-shadow:0 2px 8px #000; z-index:2; }
  #scan .bottom { position:absolute; left:12px; right:12px; bottom:18px; z-index:2; display:flex; gap:10px; }
  #scan .bottom button { flex:1; margin:0; }
  #scan .timer { background:rgba(0,0,0,.65); padding:8px 12px; border-radius:12px; font-variant-numeric:tabular-nums; font-size:17px; font-weight:700; }
  #scan .frame { position:absolute; left:50%; top:50%; width:62vmin; height:62vmin; transform:translate(-50%,-58%);
    border:4px solid rgba(255,255,255,.9); border-radius:22px; box-shadow:0 0 0 2000px rgba(0,0,0,.2); z-index:1; pointer-events:none; }
  #scan.rec .frame { border-color:var(--red); }
  #scan.manual .frame { display:none; }
  #scan .count { position:absolute; inset:0; display:none; place-items:center; font-size:140px; font-weight:900; color:#fff; text-shadow:0 4px 20px #000; z-index:3; }
  /* Full-screen panels */
  .panel { position:fixed; inset:0; display:none; z-index:20; background:var(--bg); overflow:auto; }
  .panel .wrap { padding-top:24px; }
  .panel h2 { font-size:26px; text-align:center; margin:10px 0 16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .choice { border:3px solid var(--line); background:var(--card); color:var(--text); border-radius:20px; padding:18px 8px; font-size:18px; font-weight:800;
    display:flex; flex-direction:column; align-items:center; gap:8px; min-height:130px; justify-content:center; text-align:center; }
  .choice .i { font-size:48px; line-height:1; }
  .choice.sel { border-color:var(--blue); background:#0c4a6e; }
  .placeBtn { display:flex; align-items:center; gap:14px; width:100%; border:2px solid var(--line); background:var(--card); color:var(--text);
    border-radius:16px; padding:14px; font-size:20px; font-weight:700; margin-bottom:10px; text-align:left; }
  .placeBtn .i { font-size:34px; }
  .mic { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:3px solid var(--blue); background:#0c4a6e; color:#fff;
    border-radius:20px; padding:18px; font-size:22px; font-weight:800; margin:12px 0; }
  .mic.on { border-color:var(--red); background:#7f1d1d; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  #result .ico { font-size:96px; line-height:1; text-align:center; margin-top:30px; }
  #result h2 { margin:12px 0 6px; }
  #result .sub { text-align:center; color:var(--muted); font-size:18px; }
  #banner { position:fixed; left:10px; right:10px; top:10px; z-index:40; display:none; background:var(--amber); color:#422006; border-radius:18px;
    padding:16px; font-size:20px; font-weight:800; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.5); animation:pulse 1s 4; }
  #toast { position:fixed; left:16px; right:16px; bottom:20px; background:#334155; color:#fff; padding:14px; border-radius:14px; font-size:17px;
    opacity:0; transform:translateY(20px); transition:.25s; z-index:50; text-align:center; pointer-events:none; }
  #toast.show { opacity:1; transform:none; } #toast.err { background:#7f1d1d; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div id="scan">
  <video id="vid" playsinline muted></video>
  <canvas id="cv"></canvas>
  <div class="frame"></div>
  <div class="count" id="count"></div>
  <div class="top"><span class="timer" id="timer"></span><span class="timer" id="mode"></span></div>
  <div class="hint" id="hint"></div>
  <div class="bottom">
    <button class="btn ghost" id="cancelScan"></button>
    <button class="btn amber" id="noqrBtn" style="display:none"></button>
  </div>
</div>

<div class="panel" id="flow"><div class="wrap" id="flowIn"></div></div>
<div class="panel" id="result"><div class="wrap" id="resultIn"></div></div>
<div id="banner"></div>

<script src="vendor/supabase.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="i18n.js"></script>
<script src="guard.js"></script>
</body>
</html>
